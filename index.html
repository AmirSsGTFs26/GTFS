<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTF RTS v0.6</title><style>*{box-sizing:border-box}body{margin:0;background:#061018;color:#fff;font-family:Tahoma,Arial;overflow:hidden}button,select{font:inherit}#menu{height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#184b61,#05080d 65%)}.box{width:min(900px,94vw);padding:28px;border:1px solid #496775;border-radius:22px;background:#09131beF;text-align:center}.logo{font-size:52px;font-weight:900;color:#ffd447;letter-spacing:5px}.sub{color:#a8bac2;margin:8px 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;border:1px solid #294651;border-radius:14px;background:#101d25}.card h2{margin:0 0 10px;color:#ffd447}.btn{width:100%;padding:11px;margin:4px 0;border:1px solid #4c6470;border-radius:9px;background:#182b35;color:#fff;cursor:pointer}.btn:hover{background:#29424d}.input{width:100%;padding:11px;border-radius:9px;background:#071219;color:#fff;border:1px solid #48606b}.game{display:none;height:100vh}.top{height:54px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#0c161d;border-bottom:1px solid #334b56}.brand{color:#ffd447;font-weight:bold}.stats b{color:#8ee49a;margin:0 4px}.layout{height:calc(100vh - 54px);display:flex;gap:8px;padding:8px}.map{position:relative;flex:1}.map canvas{width:100%;height:100%;background:#18536b;border:2px solid #3c5661;border-radius:10px}.side{width:230px;background:#101c23;border:1px solid #344c57;border-radius:10px;padding:8px;overflow:auto}.side h3{color:#ffd447;margin:7px}.side button{width:100%;padding:8px;margin:3px 0;background:#192b34;color:#fff;border:1px solid #405b67;border-radius:7px}.hint{position:absolute;top:12px;left:12px;background:#000b;padding:8px;border-radius:7px;font-size:11px}.toast{position:absolute;bottom:12px;left:12px;background:#000b;padding:8px;border-radius:7px;font-size:11px}@media(max-width:750px){.grid{grid-template-columns:1fr}.logo{font-size:38px}.side{position:absolute;right:15px;top:62px;width:180px;z-index:4;max-height:75vh}} </style><section id="menu"><div class="box"><div class="logo">⚡ GTF RTS</div><div class="sub">v0.6 • تصاویر جدید • ۲۶ ظاهر متفاوت بازیکن</div><div class="grid"><div class="card"><h2>شروع بازی</h2><select id="map" class="input"><option value="earth">🌍 زمین</option><option value="islands">🏝️ جزایر</option><option value="desert">🏜️ بیابان</option><option value="arctic">❄️ قطب</option></select><button class="btn" onclick="start('ai')">🤖 هوش مصنوعی</button><button class="btn" onclick="start('local')">👥 دو نفره</button></div><div class="card"><h2>۲۶ بازیکن</h2><p class="sub">هر بازیکن فرمانده تصویری مخصوص خودش را دارد.</p><button class="btn" onclick="alert('سیستم اتاق ۲۶ نفره در حال توسعه است؛ این نسخه تصاویر و سیستم ۲۶ ظاهر را فعال کرده است.')">🔗 اتاق چندنفره</button><button class="btn" onclick="alert('WASD یا کلیدهای جهت برای دوربین. کلیک روی واحد و سپس زمین برای حرکت.')">🎮 راهنما</button></div></div></div></section><section id="game" class="game"><header class="top"><div class="brand">⚡ GTF RTS v0.6</div><div class="stats">💰<b id="money">900</b> 🤖<b id="ec">0</b> ⏱️<b id="time">00:00</b></div></header><div class="layout"><div class="map"><canvas id="c" width="1200" height="700"></canvas><div class="hint" id="hint"></div><div class="toast" id="toast">نبرد شروع شد!</div></div><aside class="side"><h3>واحدها</h3><button onclick="spawn('scout')">🪖 سرباز 100</button><button onclick="spawn('tank')">🚙 تانک 180</button><button onclick="spawn('heavy')">🛡️ تانک سنگین 300</button><h3>ساختمان</h3><button onclick="build('factory')">🏭 کارخانه 250</button><button onclick="build('turret')">🔷 برج دفاعی 180</button><h3>دوربین</h3><button onclick="center()">🎯 پایگاه من</button><button onclick="zoom*=1.1">🔎 نزدیک</button><button onclick="zoom*=.9">🔍 دور</button><button onclick="location.reload()">↻ شروع دوباره</button><button onclick="back()">🏠 منو</button><p class="sub">واحدها با تصاویر ارسالی تو نمایش داده می‌شوند. ۲۶ فرمانده ظاهر متفاوت دارند.</p></aside></div></section><script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),MW=3600,MH=2200;let zoom=.8,cam={x:0,y:750},money=900,t=0,map='earth',mode='ai',sel=null,units=[],foes=[],buildings=[],res=[];const tiles=['assets/gtf_t00.webp','assets/gtf_t01.webp','assets/gtf_t10.webp','assets/gtf_t11.webp'],im=tiles.map(u=>{let a=new Image;a.src=u;return a});const color=['#e33','#2989d8','#4caf50','#f0d43c','#914bd7','#ef761c','#27c5d1','#ef9bc5','#c99c72','#dce2e6','#68d83d','#9a4fd0','#27bfc0','#d53b44','#3f8de0','#e4c33d','#eee','#c744b0','#ef6e1a','#1bc4c9','#f1d0a9','#7d5132','#4d9a4d','#8b54b9','#d5a51c','#536f9e'];const spr={tank:27,heavy:28,factory:36,turret:40,crystal:44};
function sp(n,px,py,s){let id=typeof n==='number'?n:spr[n]||1,id0=id-1,tx=id0%8,ty=Math.floor(id0/8),tile=Math.floor(tx/4)+2*Math.floor(ty/4),col=tx%4,row=ty%4,a=im[tile];if(!a.complete)return; x.drawImage(a,col*64,row*64,64,64,px-s/2,py-s/2,s,s)}
function start(m){mode=m;map=document.getElementById('map').value;document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';money=900;t=0;units=[];foes=[];buildings=[];res=[];cam={x:0,y:MH/2-400};for(let i=0;i<55;i++)res.push({x:80+Math.random()*(MW-160),y:80+Math.random()*(MH-160),n:500});add(0,330,MH/2);if(m==='local')add(1,MW-330,MH/2);if(m==='ai')for(let i=0;i<12;i++)foes.push({o:25,type:i%3?'tank':'heavy',x:MW-500-Math.random()*300,y:300+Math.random()*(MH-600),r:25,hp:220,target:null});document.getElementById('hint').textContent=(map==='earth'?'🌍 زمین':map==='islands'?'🏝️ جزایر':map==='desert'?'🏜️ بیابان':'❄️ قطب')+' • کلیک = انتخاب/حرکت • WASD = دوربین';center()}
function add(o,px,py){buildings.push({type:'base',o,x:px,y:py,w:220,h:150,hp:1500});units.push({o,comm:1,type:'scout',x:px+(o?90:-90),y:py,r:30,hp:320,target:null})}
function center(){cam.x=Math.max(0,Math.min(MW-1500,units[0]?.x-500||0));cam.y=Math.max(0,Math.min(MH-875,units[0]?.y-350||650))}function W(e){let r=cv.getBoundingClientRect();return{x:cam.x+(e.clientX-r.left)*1500/r.width/zoom,y:cam.y+(e.clientY-r.top)*875/r.height/zoom}}
cv.onclick=e=>{let p=W(e),u=units.find(q=>q.o===0&&Math.hypot(q.x-p.x,q.y-p.y)<45);if(u){sel=u;document.getElementById('toast').textContent='واحد انتخاب شد';return}if(sel){sel.target=p;document.getElementById('toast').textContent='دستور حرکت صادر شد'}};addEventListener('keydown',e=>{let q=35/zoom,k=e.key.toLowerCase();if(k==='w'||k==='arrowup')cam.y-=q;if(k==='s'||k==='arrowdown')cam.y+=q;if(k==='a'||k==='arrowleft')cam.x-=q;if(k==='d'||k==='arrowright')cam.x+=q;cam.x=Math.max(0,Math.min(MW-1500/zoom,cam.x));cam.y=Math.max(0,Math.min(MH-875/zoom,cam.y))});
function move(u){if(!u.target)return;let dx=u.target.x-u.x,dy=u.target.y-u.y,l=Math.hypot(dx,dy);if(l>4){let v=u.type==='heavy'?1.2:u.type==='tank'?1.8:2.5;u.x+=dx/l*v;u.y+=dy/l*v}else u.target=null}
function spawn(type){let c=type==='scout'?100:type==='tank'?180:300;if(money<c)return;money-=c;let u=units.find(q=>q.o===0&&q.comm);units.push({o:0,type,x:u.x+Math.random()*100-50,y:u.y+Math.random()*100-50,r:23,hp:type==='heavy'?280:160,target:null})}
function build(type){let c=type==='factory'?250:180;if(money<c)return;money-=c;let u=units.find(q=>q.o===0&&q.comm);buildings.push({type,o:0,x:u.x+Math.random()*160-80,y:u.y+Math.random()*160-80,w:type==='factory'?160:130,h:120,hp:type==='factory'?700:500})}
function ai(){foes.forEach(e=>{let u=units.slice().sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0];if(!u)return;e.target=u;if(Math.hypot(u.x-e.x,u.y-e.y)<150)u.hp-=.25});if(Math.random()<.01&&foes.length<26)foes.push({o:25,type:Math.random()<.5?'tank':'heavy',x:MW-500,y:300+Math.random()*(MH-600),r:25,hp:220,target:null})}
function terrain(){x.fillStyle=map==='desert'?'#a87542':map==='arctic'?'#d7eef1':'#185c73';x.fillRect(0,0,MW,MH);if(map==='earth'){for(let i=0;i<28;i++){x.fillStyle=i%2?'#3d7d43':'#567d3e';x.beginPath();x.ellipse((i*677+200)%MW,(i*413+140)%MH,100+(i%5)*70,60+(i%4)*35,i*.3,0,7);x.fill()}}if(map==='islands'){x.fillStyle='#4c8c55';for(let i=0;i<24;i++){x.beginPath();x.ellipse(100+Math.random()*(MW-200),100+Math.random()*(MH-200),70+Math.random()*130,45+Math.random()*80,0,0,7);x.fill()}}if(map==='desert'){x.strokeStyle='#c69255';x.lineWidth=12;for(let y=100;y<MH;y+=180){x.beginPath();for(let q=0;q<MW;q+=100)x.lineTo(q,y+Math.sin(q/150)*30);x.stroke()}}if(map==='arctic'){x.fillStyle='#b5dbe1';for(let i=0;i<18;i++)x.fillRect((i*613)%MW,(i*347)%MH,300,100)}}
function bar(u){x.fillStyle='#300';x.fillRect(u.x-u.r,u.y-u.r-9,u.r*2,5);x.fillStyle=color[u.o%26];x.fillRect(u.x-u.r,u.y-u.r-9,u.r*2*Math.max(0,u.hp/(u.comm?320:u.type==='heavy'?280:160)),5)}
function draw(){x.setTransform(zoom,0,0,zoom,-cam.x*zoom,-cam.y*zoom);terrain();res.forEach(r=>sp('crystal',r.x,r.y,50));buildings.forEach(b=>{sp(b.type,b.x,b.y,Math.max(b.w,b.h)*.85);bar({x:b.x,y:b.y,r:b.w/2,hp:b.hp,o:b.o})});units.forEach(u=>{sp(u.comm?u.o+1:u.type==='heavy'?'heavy':u.type==='tank'?'tank':u.o+1,u.x,u.y,u.comm?70:55);bar(u)});foes.forEach(e=>{sp(e.type,e.x,e.y,60);bar(e)});if(sel){x.strokeStyle='#ffd447';x.lineWidth=3;x.beginPath();x.arc(sel.x,sel.y,sel.r+8,0,7);x.stroke()}x.setTransform(1,0,0,1,0,0)}function loop(){t+=.016;units.forEach(move);foes.forEach(move);if(mode==='ai')ai();units.forEach(u=>{let r=res.find(z=>z.n>0&&Math.hypot(z.x-u.x,z.y-u.y)<40);if(r){r.n--;money+=.08}});document.getElementById('money').textContent=Math.floor(money);document.getElementById('ec').textContent=foes.length;document.getElementById('time').textContent=new Date(t*1000).toISOString().slice(14,19);draw();requestAnimationFrame(loop)}function back(){location.reload()}loop();</script></html>
