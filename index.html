<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTF RTS</title>
<style>
:root{--bg:#0b1015;--panel:#17212a;--line:#3c4d58;--gold:#ffd447;--text:#eef3f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;overflow:hidden}header{height:62px;background:#141c23;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:bold;color:var(--gold)}.logo img{height:46px}.stats{font-size:13px}.stats b{color:#8ee49a;margin:0 5px}main{height:calc(100vh - 62px);display:flex;gap:8px;padding:8px}.game{position:relative;flex:1;min-width:0}canvas{width:100%;height:100%;display:block;border:2px solid var(--line);border-radius:9px;background:#263c2a}.panel{width:245px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto}h2{color:var(--gold);margin:2px 0 12px}h3{margin:15px 0 7px}button{width:100%;padding:10px;margin:4px 0;border:1px solid #52636d;background:#26343d;color:#fff;border-radius:6px;font-family:inherit;cursor:pointer}button:hover{background:#344751}.danger{background:#553232}.overlay{position:absolute;inset:0;background:#02060bcc;display:none;align-items:center;justify-content:center}.modal{width:min(430px,92%);background:#18232c;border:1px solid #536570;border-radius:12px;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;margin:13px 0}.row select,.row input{width:55%}#msg{position:absolute;bottom:12px;left:12px;background:#06100ddd;padding:8px 10px;border-radius:7px;font-size:12px}small{color:#c5d0d5;line-height:1.7}@media(max-width:760px){.panel{position:absolute;right:8px;top:70px;width:190px;max-height:76vh;z-index:4}.stats{font-size:10px}}
</style></head>
<body>
<header><div class="logo"><img src="assets/logo.svg" alt="GTF">GTF RTS</div><div class="stats">💰<b id="money">600</b> ⚡<b id="energy">100</b> 🏠<b id="pop">1/12</b> ⏱️<b id="time">00:00</b></div></header>
<main><section class="game"><canvas id="c" width="1100" height="650"></canvas><div id="msg">واحد را انتخاب کن و سپس روی زمین مقصد را کلیک کن.</div>
<div id="settings" class="overlay"><div class="modal"><h2>⚙️ تنظیمات GTF RTS</h2><div class="row"><label>کیفیت</label><select id="quality"><option>بالا</option><option>متوسط</option><option>پایین</option></select></div><div class="row"><label>سرعت بازی</label><input id="speed" type="range" min="50" max="200" value="100"></div><div class="row"><label>نمایش شبکه</label><input id="grid" type="checkbox" checked></div><button onclick="closeSettings()">ذخیره و بستن</button></div></div></section>
<aside class="panel"><h2>⚡ فرماندهی</h2><button onclick="addUnit('drone')">🤖 ساخت پهپاد — 80</button><button onclick="addUnit('scout')">🛰️ ساخت کاوشگر — 120</button><button onclick="build('factory')">🏭 کارخانه — 220</button><button onclick="build('turret')">🔷 مرکز دفاعی — 180</button><h3>بازی</h3><button onclick="openSettings()">⚙️ تنظیمات</button><button onclick="saveGame()">💾 ذخیره</button><button onclick="loadGame()">📂 بارگذاری</button><button class="danger" onclick="location.reload()">↻ شروع دوباره</button><h3>راهنما</h3><small>کلیک روی واحد = انتخاب<br>کلیک روی زمین = حرکت<br>روی کریستال‌های سبز حرکت کن تا منابع جمع شوند.</small></aside></main>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d'),W=1100,H=650;const A={};['ground','base','factory','drone','turret','resource','logo'].forEach(n=>{A[n]=new Image();A[n].src='assets/'+n+'.svg'});
let money=600,energy=100,pop=1,t=0,sel=null,units=[],buildings=[{x:125,y:520,w:180,h:120,type:'base'}],resources=[],speed=1;
for(let i=0;i<8;i++)resources.push({x:330+Math.random()*650,y:70+Math.random()*500,amount:250});units.push({type:'drone',x:210,y:470,r:22,target:null});
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),msg=s=>document.getElementById('msg').textContent=s;
function addUnit(type){let cost=type==='drone'?80:120;if(money<cost||pop>=12)return msg('منابع یا ظرفیت کافی نیست.');money-=cost;units.push({type,x:210,y:470,r:20,target:null});pop++;msg('واحد جدید آماده شد.');}
function build(type){let cost=type==='factory'?220:180;if(money<cost)return msg('منابع کافی نیست.');money-=cost;buildings.push({x:300+Math.random()*150,y:480,w:100,h:80,type});msg('ساختمان ساخته شد.');}
C.addEventListener('click',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height,u=units.find(q=>d(q,{x,y})<q.r+10);if(u){sel=u;msg('واحد انتخاب شد.');return}if(sel){sel.target={x,y};msg('دستور حرکت صادر شد.');}});
function update(){t+=.016*speed;units.forEach(u=>{if(u.target){let dx=u.target.x-u.x,dy=u.target.y-u.y,len=Math.hypot(dx,dy);if(len>3){u.x+=dx/len*1.8*speed;u.y+=dy/len*1.8*speed}else u.target=null}let r=resources.find(z>0&&resources.find(r=>r.amount>0&&d(u,r)<28));if(r){r.amount-=.35*speed;money+=.15*speed;}});resources=resources.filter(r=>r.amount>0);document.getElementById('money').textContent=Math.floor(money);document.getElementById('energy').textContent=Math.floor(energy);document.getElementById('pop').textContent=pop+'/12';document.getElementById('time').textContent=new Date(t*1000).toISOString().slice(14,19)}
function draw(){ctx.fillStyle='#263c2a';ctx.fillRect(0,0,W,H);if(document.getElementById('grid').checked){ctx.strokeStyle='#35553a';for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}ctx.fillStyle='#24495c';ctx.fillRect(500,0,100,H);resources.forEach(r=>ctx.drawImage(A.resource,r.x-32,r.y-32,64,64));buildings.forEach(b=>{let im=A[b.type==='base'?'base':b.type==='factory'?'factory':'turret'];ctx.drawImage(im,b.x-b.w/2,b.y-b.h/2,b.w,b.h)});units.forEach(u=>{ctx.drawImage(A.drone,u.x-30,u.y-30,60,60);if(u===sel){ctx.strokeStyle='#ffd447';ctx.lineWidth=3;ctx.beginPath();ctx.arc(u.x,u.y,34,0,Math.PI*2);ctx.stroke()}})}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
function openSettings(){document.getElementById('settings').style.display='flex'}function closeSettings(){speed=+document.getElementById('speed').value/100;localStorage.gtfSettings=JSON.stringify({speed,grid:document.getElementById('grid').checked});document.getElementById('settings').style.display='none'}function saveGame(){localStorage.gtfSave=JSON.stringify({money,energy,pop,t,units,buildings,resources});msg('بازی ذخیره شد.')}function loadGame(){try{Object.assign(window,JSON.parse(localStorage.gtfSave));msg('بازی بارگذاری شد.')}catch(e){msg('ذخیره‌ای پیدا نشد.')}}
try{const s=JSON.parse(localStorage.gtfSettings||'{}');if(s.speed)speed=s.speed;if(s.grid!==undefined)document.getElementById('grid').checked=s.grid}catch(e){}
</script></body></html>
